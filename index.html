<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片提交</title>
  <style>
    :root{--ink:#16202a;--muted:#65727e;--line:#d9e0e5;--paper:#f7f8f6;--accent:#176b5b;--accent2:#e6f2ee}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    .wrap{width:min(680px,calc(100% - 32px));margin:0 auto;padding:56px 0}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase}
    h1{font-size:clamp(30px,6vw,48px);line-height:1.12;margin:12px 0 10px;letter-spacing:-.02em}p{color:var(--muted);margin:0 0 30px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 10px 30px #18252b0b}
    label{display:block;font-weight:700;margin:0 0 8px}input[type=text]{width:100%;height:48px;border:1px solid var(--line);border-radius:5px;padding:0 13px;font:inherit;color:var(--ink);outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
    .field{margin-bottom:22px}.upload{border:1.5px dashed #aebbc0;border-radius:6px;padding:22px;text-align:center;background:#fcfdfc;cursor:pointer}.upload:hover{border-color:var(--accent);background:var(--accent2)}.upload input{display:none}.upload strong{display:block}.upload small{color:var(--muted)}
    #preview{display:none;width:100%;max-height:280px;object-fit:contain;border-radius:4px;margin-top:15px;background:#edf1ef}.actions{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:28px}.link{color:var(--accent);font-size:14px}.btn{border:0;border-radius:5px;background:var(--accent);color:#fff;font:700 15px inherit;padding:12px 22px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{margin-top:16px;color:var(--accent);font-size:14px;display:none}
    @media(max-width:520px){.wrap{padding:35px 0}.panel{padding:20px}.actions{align-items:stretch;flex-direction:column-reverse}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">SUBMISSION</div><h1>提交你的图片</h1><p>填写 ID 并上传一张图片，提交后内容会显示在排行榜页面。</p>
    <section class="panel">
      <div class="field"><label for="userId">ID</label><input id="userId" type="text" maxlength="40" placeholder="请输入你的 ID" autocomplete="off"></div>
      <div class="field"><label>图片</label><label class="upload" for="image"><strong id="uploadText">点击选择图片</strong><small>支持 JPG、PNG、GIF、WEBP，建议不超过 5MB</small><input id="image" type="file" accept="image/*"><img id="preview" alt="图片预览"></label></div>
      <div class="actions"><a class="link" href="ranking.html">查看排行榜 →</a><button class="btn" id="submit" disabled>提交</button></div><div class="notice" id="notice"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
    const db=supabase.createClient('https://ryfksqgkdkeptoryduuk.supabase.co','sb_publishable_-pmyLgDNzYeJVk_FumrwGg_heMsW_6t');
    const id=document.querySelector('#userId'), file=document.querySelector('#image'), preview=document.querySelector('#preview'), submit=document.querySelector('#submit'), text=document.querySelector('#uploadText'), notice=document.querySelector('#notice'); let selectedFile=null;
    function check(){submit.disabled=!id.value.trim()||!imageData}
    file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;if(f.size>5*1024*1024){alert('图片不能超过 5MB');file.value='';return}selectedFile=f;preview.src=URL.createObjectURL(f);preview.style.display='block';text.textContent=f.name;check()});id.addEventListener('input',check);
    submit.addEventListener('click',async()=>{submit.disabled=true;submit.textContent='上传中...';try{const path=`${crypto.randomUUID()}-${selectedFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const upload=await db.storage.from('images').upload(path,selectedFile,{contentType:selectedFile.type});if(upload.error)throw upload.error;const image_url=db.storage.from('images').getPublicUrl(path).data.publicUrl;const result=await db.from('submissions').insert({user_id:id.value.trim(),image_url}).select().single();if(result.error)throw result.error;notice.textContent='提交成功，已进入排行榜';notice.style.display='block';submit.textContent='已提交'}catch(e){notice.textContent='提交失败：'+e.message;notice.style.display='block';submit.disabled=false;submit.textContent='提交'}});
  </script>
</body>
</html>
