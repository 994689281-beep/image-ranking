<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>排行榜</title>
<style>
:root{--ink:#16202a;--muted:#65727e;--line:#d9e0e5;--paper:#f7f8f6;--accent:#176b5b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:46px 0}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:13px}h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:10px 0 5px;letter-spacing:-.02em}.sub{color:var(--muted);margin:0}.back{color:var(--accent);text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.item{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}.item img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#e9eeeb}.info{padding:13px 15px}.rank{position:absolute;top:10px;left:10px;background:#fff;color:var(--accent);font-weight:800;border-radius:4px;padding:2px 8px;box-shadow:0 2px 8px #0002}.uid{font-weight:800;word-break:break-all}.time{color:var(--muted);font-size:13px}.empty{border:1px dashed #aebbc0;text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;background:#fff;border-radius:8px}@media(max-width:600px){.top{align-items:start;gap:18px;flex-direction:column}.wrap{padding:32px 0}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">LEADERBOARD</div><h1>图片排行榜</h1><p class="sub" id="count"></p></div><a class="back" href="index.html">去提交 →</a></header><section class="grid" id="grid"></section></main>
<script>const list=JSON.parse(localStorage.getItem('submissions')||'[]'),grid=document.querySelector('#grid');document.querySelector('#count').textContent=list.length?`共 ${list.length} 个提交`:'还没有提交';if(!list.length){grid.innerHTML='<div class="empty">暂无内容，成为第一个提交的人吧。</div>'}else list.forEach((x,i)=>{const el=document.createElement('article');el.className='item';el.innerHTML=`<span class="rank">#${i+1}</span><img src="${x.image}" alt="${x.id} 上传的图片"><div class="info"><div class="uid">${x.id.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div><div class="time">${new Date(x.time).toLocaleString('zh-CN')}</div></div>`;grid.appendChild(el)})</script></body></html>
